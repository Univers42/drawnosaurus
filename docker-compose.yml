services:
  mongo:
    image: mongo:7
    command: ["--bind_ip_all", "--quiet"]
    volumes:
      - mongo_data:/data/db
    ports:
      # Host ports are all overridable because this machine also runs the sibling
      # osionos stack, which already owns 3000/4000/5173/27017. Container-internal
      # ports never change, so the compose network and CI are unaffected.
      #
      # On 127.0.0.1 only. This mongod has no password, and published on every
      # interface anyone on the network could read or rewrite every board in it.
      - "127.0.0.1:${MONGO_PORT:-27019}:27017"
    healthcheck:
      # api and the test runner both wait on this: connecting to a mongod that is
      # still starting up is the classic flaky-CI cause.
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

  # Live collaboration transport (engine/realtime). Host port 4402 avoids API
  # 4300 and the realtime sandbox's default 4002. WS pub/sub only — no
  # Postgres/Mongo CDC (sandbox compose needs POSTGRES_PASSWORD; we do not).
  # Dockerfile is under docker/ (outside the build context).
  realtime:
    build:
      context: ./engine/realtime
      dockerfile: ../../docker/realtime.Dockerfile
    environment:
      REALTIME_HOST: "0.0.0.0"
      REALTIME_PORT: "4000"
      REALTIME_AUTH: "noauth"
      REALTIME_STATIC_DIR: "/app/static"
      RUST_LOG: "info,realtime_gateway=info,realtime_server=info"
    ports:
      - "${REALTIME_PORT:-4402}:4000"

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    environment:
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: drawnosaurus
      PORT: "4000"
      # The browser talks to the API cross-origin in this compose setup (different
      # ports); the Vite dev proxy is same-origin and needs none of this.
      CORS_ORIGIN: "*"
      AUTH_MODE: dev
      # Where people on the network reach the gateway, best first — the computer's DNS
      # name, then its addresses — worked out by `make up` on the host (scripts/lan.sh):
      # inside this container there are no addresses but its own. See share.ts.
      SHARE_LAN_ORIGINS: ${SHARE_LAN_ORIGINS:-}
      # Where the internet link the Share dialog opens sends requests: the gateway's
      # internet entrance. See tunnel.ts.
      SHARE_TUNNEL_TARGET: http://gateway:82
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      # For tools on this computer. Everyone else goes through the gateway, which is
      # what decides what a guest may do; published on every interface, this port let
      # anyone on the network walk around it.
      - "127.0.0.1:${API_PORT:-4300}:4000"

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
      # Which commits the image is built from. Worked out by the Makefile on the host,
      # because .git is not in the build context. `unknown` when built without it.
      args:
        BUILD_APP_SHA: ${BUILD_APP_SHA:-unknown}
        BUILD_ENGINE_SHA: ${BUILD_ENGINE_SHA:-unknown}
    environment:
      PORT: "3000"
      # Empty: the API is on the page's own origin, behind the gateway. It used to be
      # http://localhost:4300, which on a colleague's computer is their own machine.
      PUBLIC_API_URL: ""
    depends_on:
      - api

  # The one address everything is reached at — the app and /v1 on the same origin, from
  # any name this computer is reached by. Who is asking is decided by which entrance a
  # connection arrived at; see docker/gateway/Caddyfile.
  gateway:
    image: caddy:2.10.2-alpine
    volumes:
      - ./docker/gateway/Caddyfile:/etc/caddy/Caddyfile:ro
      PUBLIC_REALTIME_WS_URL: ws://localhost:${REALTIME_PORT:-4402}/ws
    depends_on:
      - api
      - realtime
      - web
    ports:
      # This computer's entrance, on 127.0.0.1 only: nobody else can connect to it.
      - "127.0.0.1:${WEB_PORT:-5273}:80"
      # Everyone else's, on every interface — wired, Wi-Fi, whatever address this computer
      # has today — which is what the links in the Share dialog point at. Its own port:
      # rootless Docker cannot publish one port on two addresses.
      - "${SHARE_PORT:-5274}:81"

  # Ephemeral runner for install/typecheck/lint/test. The repo is bind-mounted so
  # results land on the host; only the pnpm download cache is a volume.
  tooling:
    image: node:22-bookworm-slim
    working_dir: /app
    environment:
      CI: "1"
      MONGO_URL: mongodb://mongo:27017
      MONGO_DB: drawnosaurus_test
      PNPM_HOME: /pnpm
      npm_config_store_dir: /pnpm/store
    volumes:
      - .:/app
      - pnpm_store:/pnpm/store
    entrypoint: ["/app/scripts/with-pnpm.sh"]
    command: ["pnpm", "quality"]

  # Builds engine/pkg from the Rust crate. Separate from every other image so only
  # this one needs a Rust toolchain.
  wasm:
    build:
      context: .
      dockerfile: docker/wasm.Dockerfile
    volumes:
      - ./engine:/engine
      - cargo_home:/cargo-home

volumes:
  mongo_data:
  pnpm_store:
  cargo_home:
